<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulador VR - Inspección de andamio (prototipo)</title>
<style>
  html,body{margin:0;height:100%;background:#111;font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:#fff;overflow:hidden}
  #app{position:fixed;inset:0}
  #hud{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:10px;font-size:14px}
  #help{position:fixed;left:10px;bottom:10px;font-size:12px;opacity:.85;max-width:46vw;background:rgba(0,0,0,.45);padding:6px 10px;border-radius:8px}
  #actions{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
  #vrbtn{position:fixed;bottom:14px;right:14px}
  button{font:600 15px system-ui,sans-serif;border:0;border-radius:10px;padding:12px 18px;background:#2f7de1;color:#fff;cursor:pointer}
  button.red{background:#c0392b}
  button.green{background:#1e8e5a}
  button.sec{background:#3a4656}
  button:disabled{opacity:.5;cursor:default}
  #modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);overflow:auto}
  #card{max-width:660px;max-height:92vh;overflow:auto;background:#161d27;border-radius:16px;padding:22px 26px;margin:10px;line-height:1.45}
  #card h1{font-size:22px;margin:0 0 10px}
  #card ul{list-style:none;padding:0;margin:12px 0}
  #card li{padding:8px 10px;margin:6px 0;border-radius:8px;background:#1f2937}
  #card li.ok{border-left:5px solid #2ecc71}
  #card li.bad{border-left:5px solid #e74c3c}
  #card li span{display:block;font-size:13px;opacity:.85;margin-top:2px}
  #card .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  #card small{display:block;margin-top:12px;opacity:.6}
  #card .fall{background:#3a1f1f;border-left:5px solid #e74c3c;padding:8px 10px;border-radius:8px;margin:10px 0;font-weight:600}
  .score{font-size:18px;font-weight:700}
  #toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:#f39c12;color:#111;padding:8px 14px;border-radius:10px;font-weight:600;display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <div id="hud"></div>
  <div id="help">Arrastra para mirar. Clic en un elemento = marcar/desmarcar. Círculos del piso (o teclas 1-4) = cambiar de punto de vista.</div>
  <div id="actions"></div>
  <div id="toast"></div>
  <div id="modal"><div id="card"></div></div>
</div>
<button id="vrbtn" disabled>Comprobando VR…</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

/* ============================================================
   PARÁMETROS EXTERNALIZADOS
   Se pueden sobrescribir por URL:  ?caida=fundido   ?niveles=3
   ============================================================ */
const CONFIG = {
  niveles: 5,                  // niveles de trabajo de 2 m c/u (5 = 10 m)
  entorno: true,               // instalación de faenas alrededor (?entorno=0 la desactiva si el visor va lento)
  trabajoSegundos: 3.5,        // tiempo "trabajando" en altura antes del remecido
  remecidoSegundos: 2.0,       // duración del remecido previo al colapso
  modoCaida: 'visible',        // 'visible' = se ve la caída hasta el suelo | 'fundido' = corte a negro sin caída (más cómodo)
  alfaColapso: 0.62,           // aceleración angular del vuelco (rad/s²)
  anguloDesprendimientoRad: 0.25, // inclinación a la que el trabajador pierde el apoyo
  anguloMaxRad: 1.52,          // inclinación final del andamio caído
  negroPostImpactoSeg: 1.8,    // pantalla en negro tras el impacto
  inclinacionRad: 0.12,        // solo modo 'fundido'
  fadeSegundos: 0.6,
  penalizacionFalsoPositivo: 10,
  factorPuntajeSiColapsa: 0.3,
  endpointRegistro: null       // ej: "https://tu-backend/api/sesiones" (POST JSON). null = solo descarga manual
};
const _qs = new URLSearchParams(location.search);
if (_qs.get('caida') === 'fundido') CONFIG.modoCaida = 'fundido';
if (_qs.get('entorno') === '0') CONFIG.entorno = false;
if (_qs.get('niveles')) { const n = parseInt(_qs.get('niveles'), 10); if (n >= 2 && n <= 8) CONFIG.niveles = n; }
const TOP = CONFIG.niveles * 2;   // altura de la plataforma de trabajo (m)

/* Defectos del escenario. Contenido pedagógico POR VALIDAR con un prevencionista
   y sin referencias normativas todavía. */
const DEFECTS = [
  { id: 'arriost', nombre: 'Arriostramiento diagonal incompleto', estructural: true,
    porque: 'Sin diagonales en los niveles superiores del módulo derecho, el andamio pierde rigidez y puede deformarse lateralmente hasta colapsar.' },
  { id: 'base', nombre: 'Pie del andamio sin placa base, sobre ladrillos sueltos', estructural: true,
    porque: 'La carga no se reparte sobre suelo firme: el apoyo puede hundirse o deslizar y desestabilizar toda la estructura.' },
  { id: 'amarre', nombre: 'Falta de amarre a la fachada en el nivel superior', estructural: true,
    porque: 'Sin amarres a intervalos adecuados, un andamio alto puede volcar hacia afuera ante carga o viento.' },
  { id: 'baranda', nombre: 'Baranda ausente en el borde de la plataforma superior', estructural: false,
    porque: 'El borde queda abierto: un tropiezo o pérdida de equilibrio puede terminar en caída desde unos ' + TOP + ' m.' },
  { id: 'hueco', nombre: 'Tabla faltante en la plataforma de trabajo (hueco)', estructural: false,
    porque: 'Un hueco en el piso de trabajo permite caída a través de la abertura y aumenta el riesgo de tropiezo.' }
];

const VANT = [ {x:-9, z:2.5}, {x:9, z:2.5}, {x:-4, z:9}, {x:4, z:9} ];
const SCAF_CENTER = new THREE.Vector3(0, 0, -0.5);
const P0 = new THREE.Vector3(0.8, TOP + 0.06, -0.5);   // dónde se para el trabajador en la plataforma

/* ============================================================
   ESTADO
   ============================================================ */
const state = { phase: 'brief', marks: new Set(), log: [], t0: performance.now(), result: null, vantage: 2, inXR: false, msg: '' };
const anim = { shake0: 0, lean0: 0, collapse0: 0, collapsed: false, finalAngle: CONFIG.inclinacionRad, fall: null };
const nowS = () => performance.now() / 1000;
function logEv(type, id) { state.log.push({ t: +((performance.now() - state.t0) / 1000).toFixed(2), tipo: type, id: id || null }); }

/* temporizadores simples (sirven igual dentro de VR) */
const timers = [];
function after(sec, fn) { timers.push({ at: nowS() + sec, fn }); }
function processTimers() {
  const n = nowS();
  for (let i = timers.length - 1; i >= 0; i--) {
    if (timers[i].at <= n) { const f = timers[i].fn; timers.splice(i, 1); f(); }
  }
}

/* ============================================================
   ESCENA BASE
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9cbe8);
scene.fog = new THREE.Fog(0xa9cbe8, 50, 230);

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.05, 320);
const rig = new THREE.Group();
rig.add(camera);
scene.add(rig);
camera.position.set(0, 1.7, 0);
camera.rotation.order = 'YXZ';

scene.add(new THREE.HemisphereLight(0xffffff, 0x6b665c, 0.62));
const sun = new THREE.DirectionalLight(0xffffff, 0.62);
sun.position.set(6, 14, 10);
scene.add(sun);

/* Suelo */
const gtex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#a8966f'; g.fillRect(0, 0, 256, 256);
  let q = 777; const r = () => { q = (q * 1664525 + 1013904223) >>> 0; return q / 4294967296; };
  for (let i = 0; i < 2600; i++) {
    const v = Math.floor(120 + r() * 80);
    g.fillStyle = 'rgba(' + v + ',' + Math.floor(v * 0.9) + ',' + Math.floor(v * 0.68) + ',' + (0.12 + r() * 0.25) + ')';
    g.fillRect(r() * 256, r() * 256, 1 + r() * 4, 1 + r() * 3);
  }
  for (let i = 0; i < 40; i++) { g.fillStyle = 'rgba(70,60,45,' + (0.05 + r() * 0.08) + ')'; g.beginPath(); g.ellipse(r() * 256, r() * 256, 6 + r() * 18, 3 + r() * 9, r() * 3, 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(70, 43);
  if (renderer.capabilities && renderer.capabilities.getMaxAnisotropy) t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  return t;
})();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 245), new THREE.MeshStandardMaterial({ color: 0xffffff, map: gtex, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.position.set(0, 0, -47.5);
scene.add(ground);

// luminaria a reemplazar
const lamp = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.12, 20), new THREE.MeshStandardMaterial({ color: 0xffe9a8, emissive: 0xffd36b, emissiveIntensity: 0.6 }));
lamp.rotation.x = Math.PI / 2;
lamp.position.set(0.8, TOP + 1.9, -1.42);
scene.add(lamp);

const woodMat = new THREE.MeshStandardMaterial({ color: 0xb88a4a, roughness: 0.9 });
const steel = new THREE.MeshStandardMaterial({ color: 0x9aa0a6, metalness: 0.5, roughness: 0.5 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x3d4146, roughness: 0.7 });
const brickMat = new THREE.MeshStandardMaterial({ color: 0xa0522d, roughness: 1 });

/* ============================================================
   UTILIDADES DE GEOMETRÍA ESTÁTICA
   Lo estático se fusiona por material: pocos draw calls (importa en el Quest).
   ============================================================ */
const siteG = new THREE.Group();
let cur = siteG;
const matCache = {};
function M(c) { return matCache[c] || (matCache[c] = new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, metalness: 0.05 })); }
function sbox(w, h, d, x, y, z, c, ry) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(c));
  m.position.set(x, y, z);
  if (ry) m.rotation.y = ry;
  cur.add(m);
  return m;
}
function scyl(rt, rb, h, x, y, z, c, seg, rx, rz) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 10), M(c));
  m.position.set(x, y, z);
  if (rx) m.rotation.x = rx;
  if (rz) m.rotation.z = rz;
  cur.add(m);
  return m;
}
function stube(a, b, r, c) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 6), M(c));
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  cur.add(m);
  return m;
}
const traffic = [];                                   // vehículos en movimiento
const PF = { pos: [], nor: [], uv: [], idx: [] };     // frondas de palmeras (una sola malla)
const SPH = new THREE.SphereGeometry(1, 12, 8);
const HEMI = new THREE.SphereGeometry(1, 14, 6, 0, Math.PI * 2, 0, Math.PI / 2);
function sell(rx, ry, rz, x, y, z, c, rot) {            // elipsoide
  const m = new THREE.Mesh(SPH, M(c));
  m.scale.set(rx, ry, rz);
  m.position.set(x, y, z);
  if (rot) m.rotation.set(rot[0] || 0, rot[1] || 0, rot[2] || 0);
  cur.add(m);
  return m;
}
function shemi(rx, ry, rz, x, y, z, c) {                // media esfera (casco)
  const m = new THREE.Mesh(HEMI, M(c));
  m.scale.set(rx, ry, rz);
  m.position.set(x, y, z);
  cur.add(m);
  return m;
}
function slimb(a, b, r1, r2, c, seg) {                  // extremidad cónica con rótula en el extremo
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r2, r1, len, seg || 10), M(c));
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  cur.add(m);
  sell(r2, r2, r2, b.x, b.y, b.z, c);
  return m;
}
function strunk(y0, y1, r0, r1, zs, x, z, c) {          // tronco de sección elíptica
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r0, y1 - y0, 14), M(c));
  m.scale.z = zs;
  m.position.set(x, (y0 + y1) / 2, z);
  cur.add(m);
  return m;
}
function sblade(a, b, w, c) {                           // hoja plana (fronda)
  const len = a.distanceTo(b);
  const m = new THREE.Mesh(SPH, M(c));
  m.scale.set(w, 0.018, len / 2);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.lookAt(b);
  cur.add(m);
  return m;
}
function wheel(x, y, z, r, w) {
  scyl(r, r, w, x, y, z, 0x181818, 18, Math.PI / 2);
  scyl(r * 0.56, r * 0.56, w + 0.03, x, y, z, 0xaeb4ba, 14, Math.PI / 2);
  scyl(r * 0.2, r * 0.2, w + 0.06, x, y, z, 0x3a3f45, 8, Math.PI / 2);
}
function place(x, y, z, ry, fn) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = ry || 0;
  const prev = cur;
  cur = g;
  fn();
  cur = prev;
  cur.add(g);
}
function mergeInto(parent, src) {
  src.updateMatrixWorld(true);
  const buckets = new Map();
  const v = new THREE.Vector3();
  src.traverse(o => {
    if (!o.isMesh) return;
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry;
    const pa = g.attributes.position, na = g.attributes.normal;
    let b = buckets.get(o.material);
    if (!b) { b = { pos: [], nor: [] }; buckets.set(o.material, b); }
    const nm = new THREE.Matrix3().getNormalMatrix(o.matrixWorld);
    for (let i = 0; i < pa.count; i++) {
      v.fromBufferAttribute(pa, i).applyMatrix4(o.matrixWorld);
      b.pos.push(v.x, v.y, v.z);
      v.fromBufferAttribute(na, i).applyMatrix3(nm).normalize();
      b.nor.push(v.x, v.y, v.z);
    }
    if (g !== o.geometry) g.dispose();
    o.geometry.dispose();
  });
  buckets.forEach((b, mat) => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(b.pos, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(b.nor, 3));
    geo.computeBoundingSphere();
    parent.add(new THREE.Mesh(geo, mat));
  });
}
let _s = 12345;
const rnd = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
const scafBuild = new THREE.Group();

/* ============================================================
   ANDAMIO (la altura depende de CONFIG.niveles)
   El grupo gira alrededor de los pies delanteros (z = 0) al colapsar.
   ============================================================ */
const scaf = new THREE.Group();
scene.add(scaf);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = V(0, 1, 0);

function tube(a, b, r, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(UP, dir.clone().normalize());
  scafBuild.add(m);
  return m;
}
function box(w, h, d, x, y, z, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  scafBuild.add(m);
  return m;
}

const XS = [-2.5, 0, 2.5];
const LEVELS = [];
for (let k = 1; k <= CONFIG.niveles; k++) LEVELS.push(2 * k);

// pies (el de adelante-derecha es el defectuoso: sobre ladrillos, sin placa)
for (const x of XS) for (const z of [0, -1]) {
  const malo = (x === 2.5 && z === 0);
  tube(V(x, malo ? 0.2 : 0.1, z), V(x, TOP + 1, z), 0.04, steel);
  if (!malo) box(0.3, 0.04, 0.3, x, 0.02, z, darkMat);
}
const b1 = box(0.22, 0.1, 0.11, 2.48, 0.05, 0.04, brickMat); b1.rotation.y = 0.3;
const b2 = box(0.22, 0.1, 0.11, 2.55, 0.15, -0.02, brickMat); b2.rotation.y = -0.4;

// largueros y travesaños
for (const y of [0.4].concat(LEVELS)) {
  for (const z of [0, -1]) tube(V(-2.5, y, z), V(2.5, y, z), 0.03, steel);
  for (const x of XS) tube(V(x, y, 0), V(x, y, -1), 0.03, steel);
}

// plataformas (falta una tabla en el nivel superior, módulo derecho)
for (const y of LEVELS) for (let bay = 0; bay < 2; bay++) for (let i = 0; i < 5; i++) {
  if (y === TOP && bay === 1 && i === 3) continue;
  box(0.47, 0.05, 1.0, -2.5 + bay * 2.5 + 0.25 + i * 0.5, y + 0.035, -0.5, woodMat);
}

// diagonales en la cara frontal: módulo izquierdo en zigzag completo; derecho solo el primer nivel
for (let k = 1; k <= CONFIG.niveles; k++) {
  const yPrev = k === 1 ? 0.4 : 2 * (k - 1), yk = 2 * k;
  if (k % 2 === 1) tube(V(-2.5, yPrev, 0), V(0, yk, 0), 0.025, steel);
  else tube(V(0, yPrev, 0), V(-2.5, yk, 0), 0.025, steel);
}
tube(V(0, 0.4, 0), V(2.5, 2, 0), 0.025, steel);

// barandas superiores (falta el frente del módulo derecho)
for (const y of [TOP + 0.5, TOP + 1.0]) {
  tube(V(-2.5, y, 0), V(0, y, 0), 0.03, steel);
  tube(V(-2.5, y, -1), V(2.5, y, -1), 0.03, steel);
  tube(V(-2.5, y, 0), V(-2.5, y, -1), 0.03, steel);
  tube(V(2.5, y, 0), V(2.5, y, -1), 0.03, steel);
}

// amarres a la fachada (falta el superior derecho)
for (const x of [-2.5, 2.5]) for (const y of LEVELS) {
  if (x === 2.5 && y === TOP) continue;
  tube(V(x, y, -1), V(x, y, -1.5), 0.03, steel);
  box(0.2, 0.2, 0.04, x, y, -1.48, darkMat);
}

mergeInto(scaf, scafBuild);   // el andamio completo queda en pocos meshes

/* ============================================================
   INSTALACIÓN DE FAENAS
   Referencia: obra costera con grúa, containers, acopios, cerco y vehículos.
   ============================================================ */
// edificio en construcción (siempre presente)
const BH = TOP + 8;
sbox(24, BH, 12, 0, BH / 2, -7.5, 0xd8d0c0);
sbox(24, 1.2, 0.1, 0, 0.6, -1.45, 0xa39a8a);
for (let y = 3.5; y < TOP + 6; y += 3.5) {
  for (const x of [-9, -5.5, 5.5, 9]) {
    sbox(1.5, 1.8, 0.06, x, y, -1.485, 0xeeeeee);
    sbox(1.3, 1.6, 0.06, x, y, -1.465, 0x3b4a5a);
  }
}

if (CONFIG.entorno) {
  /* ---- terreno, calle, mar y ciudad ---- */
  sbox(600, 0.4, 185, 0, -0.25, 167.5, 0x4f86b0);              // mar
  sbox(160, 0.04, 9, 0, 0.02, 33.5, 0x3a3d40);                 // calzada
  for (let x = -76; x < 80; x += 6) sbox(2.5, 0.05, 0.2, x, 0.03, 33.5, 0xf0e68c);
  sbox(160, 0.06, 3, 0, 0.03, 28, 0xb9b6ae);                   // vereda
  sbox(160, 0.03, 14, 0, 0.015, 45, 0x5f8a3f);                 // pasto
  sbox(8, 0.03, 14, 0, 0.03, 19, 0x8b8a86);                    // camino de acceso (ripio)
  sbox(2.4, 0.03, 13, 0, 0.05, 17.5, 0x3f8a4a);                // pasillo peatonal verde
  for (let i = 0; i < 10; i++) sbox(2 + rnd() * 3, 0.02, 1.5 + rnd() * 3, (rnd() - 0.5) * 44, 0.02, -10 + rnd() * 34, 0x9a8962);   // huellas
  const tones = [0xcfcfc9, 0xb8bcc2, 0xe6e2d6, 0xa9b0b8, 0xd8c9b5];
  for (let i = 0; i < 24; i++) {
    const w = 8 + rnd() * 12, d = 10 + rnd() * 10, h = 14 + rnd() * 36;
    sbox(w, h, d, -180 + i * 15.5 + rnd() * 5, h / 2, -70 - rnd() * 50, tones[i % tones.length]);
  }
  for (let i = 0; i < 12; i++) {
    const side = i % 2 ? 1 : -1, w = 10 + rnd() * 8, d = 10 + rnd() * 8, h = 8 + rnd() * 16;
    sbox(w, h, d, side * (62 + rnd() * 40), h / 2, -20 + rnd() * 70, tones[(i + 2) % tones.length]);
  }

  /* ---- cerco perimetral con portón ---- */
  function fenceLine(x1, z1, x2, z2) {
    const L = Math.hypot(x2 - x1, z2 - z1), n = Math.max(1, Math.round(L / 2.5));
    const dx = (x2 - x1) / n, dz = (z2 - z1) / n, seg = L / n, ang = Math.atan2(-dz, dx);
    for (let i = 0; i < n; i++) {

  c.arcTo(x + w, y + h, x, y + h, r);

  c.closePath();

function wrapText(c, text, x, y, maxW, lh) {
  const words = text.split(' ');

  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (c.measureText(test).width > maxW && line) { c.fillText(line, x, y); y += lh; line = w; }
    else line = test;

  if (line) { c.fillText(line, x, y); y += lh; }

   INTERACCIÓN (un solo rayo para ratón y controles VR)
   ============================================================ */
const raycaster = new THREE.Raycaster();
const tmpM = new THREE.Matrix4();
let hover = null;

function targets() {
  const t = [];
  if (panel.visible) t.push(panel);
  if (state.phase === 'inspect') {
    HIT.forEach(h => t.push(h.mesh));
    rings.forEach(r => t.push(r));
  }
  return t;
}

  const hits = raycaster.intersectObjects(targets(), false);
  return hits.length ? hits[0] : null;
}

  if (!hit) return;
  const k = hit.object.userData.kind;
  if (k === 'panel') {
    const x = hit.uv.x * PW, y = (1 - hit.uv.y) * PH;
    for (const b of pbtns) {
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; }
    }
  } else if (k === 'hit') {
    const h = hit.object.userData.ref;
    if (state.marks.has(h.id)) { state.marks.delete(h.id); logEv('desmarca', h.id); }
    else { state.marks.add(h.id); logEv('marca', h.id); }
    state.msg = '';
    renderUI();
  } else if (k === 'ring') {
    teleport(hit.object.userData.idx);
  }

/* controles VR */
const controllers = [];
for (let i = 0; i < 2; i++) {
  const c = renderer.xr.getController(i);
  const geo = new THREE.BufferGeometry().setFromPoints([V(0, 0, 0), V(0, 0, -6)]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffffff }));
  c.add(line);
  c.userData.line = line;
  c.addEventListener('selectstart', () => {

}

const mouse = new THREE.Vector2(9, 9);
let drag = null;

cv.addEventListener('pointermove', e => {
  setMouse(e);
  if (!drag) return;
  if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5) drag.moved = true;
  if (drag.moved) {
    yaw -= (e.clientX - drag.lx) * 0.004;
    pitch -= (e.clientY - drag.ly) * 0.004;
    pitch = Math.max(-1.5, Math.min(1.5, pitch));
    applyLook();
  }
  drag.lx = e.clientX; drag.ly = e.clientY;
});
cv.addEventListener('pointerup', e => {
  if (drag && !drag.moved && !renderer.xr.isPresenting) {
    setMouse(e);
    raycaster.setFromCamera(mouse, camera);
    activate(cast());
  }
  drag = null;
});

window.addEventListener('keydown', e => {
  if (state.phase === 'inspect' && e.key >= '1' && e.key <= '4') teleport(parseInt(e.key, 10) - 1);
});

function updateHover() {
  let h = null;
  if (renderer.xr.isPresenting) {
    controllers.forEach(c => {
      setRayFromController(c);
      const hit = cast();
      const len = hit ? hit.distance : 6;
      c.userData.line.scale.z = Math.min(len, 6) / 6;
      if (hit && !h && hit.object.userData.kind === 'hit') h = hit.object.userData.ref;
    });
  } else if (Math.abs(mouse.x) <= 1 && Math.abs(mouse.y) <= 1) {
    raycaster.setFromCamera(mouse, camera);
    const hit = cast();
    if (hit && hit.object.userData.kind === 'hit') h = hit.object.userData.ref;
  }
  hover = h;
  refreshHits();
}

function refreshHits() {
  const ph = state.phase;
  for (const h of HIT) {
    const m = h.mesh.material;
    const marked = state.marks.has(h.id);
    if (ph === 'debrief') {
      if (h.defectId) { m.color.set(marked ? 0x2ecc71 : 0xe74c3c); m.opacity = 0.35; }
      else if (marked) { m.color.set(0xf1c40f); m.opacity = 0.35; }
      else m.opacity = 0;
    } else if (ph === 'inspect') {
      if (marked) { m.color.set(0xff8c00); m.opacity = 0.42; }
      else if (h === hover) { m.color.set(0xffffff); m.opacity = 0.18; }
      else m.opacity = 0;
    } else m.opacity = 0;
  }
  const showRings = ph === 'inspect';
  rings.forEach((r, i) => { r.visible = showRings && i !== state.vantage; });
}

   FLUJO DEL ESCENARIO
   ============================================================ */
function toast(msg) {
  state.msg = msg;
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  if (panel.visible) drawPanel();
  after(3.2, () => { el.style.display = 'none'; state.msg = ''; if (panel.visible) drawPanel(); });
}

function startInspect() {
  initAudio();
  state.phase = 'inspect';
  logEv('inicio_inspeccion');
  teleport(state.vantage);
  renderUI();
}

function reportNoConforme() {
  if (state.phase !== 'inspect') return;
  if (state.marks.size === 0) { toast('Marca al menos un defecto antes de reportar.'); return; }
  logEv('reporte_no_conforme');
  goDebrief('detenido', false);
}

function authorize() {
  if (state.phase !== 'inspect') return;
  logEv('autoriza_subida');
  state.phase = 'climb';
  renderUI();
  fadeTo(1, CONFIG.fadeSegundos);
  let t = CONFIG.fadeSegundos + 0.1;
  after(t, () => {
    rig.position.copy(P0);
    rig.rotation.y = 0;
    resetLook(0.12);
    state.phase = 'work';
    logEv('en_altura');
    renderUI();
    fadeTo(0, CONFIG.fadeSegundos);
  });
  t += CONFIG.fadeSegundos + CONFIG.trabajoSegundos;
  after(t, () => { state.phase = 'shake'; anim.shake0 = nowS(); creak(); logEv('remecido'); renderUI(); });
  t += CONFIG.remecidoSegundos;
  if (CONFIG.modoCaida === 'visible') {
    after(t, startCollapse);
  } else {
    after(t, () => { state.phase = 'lean'; anim.lean0 = nowS(); logEv('colapso'); });
    t += 0.35;
    after(t, () => fadeTo(1, 0.3));
    t += 0.45;
    after(t, () => { anim.collapsed = true; anim.finalAngle = CONFIG.inclinacionRad; goDebrief('colapso', true); });
  }
}

/* --- Colapso con caída visible ---
   1) 'collapse': el andamio vuelca sobre sus pies delanteros y el trabajador viaja con la plataforma.
   2) 'fall': al superar el ángulo de desprendimiento pierde el apoyo y cae libremente (g = 9.8 m/s²)
      con la velocidad que llevaba la plataforma.
   3) 'impact': al tocar suelo, corte inmediato a negro + golpe sordo (sin cuerpo ni imágenes gráficas). */
function collapseAngle(n) {
  const t = n - anim.collapse0;
  return Math.min(CONFIG.anguloMaxRad, 0.02 + 0.5 * CONFIG.alfaColapso * t * t);
}
function startCollapse() {
  anim.collapse0 = nowS();
  state.phase = 'collapse';
  logEv('colapso');
  clang();
  renderUI();
}
function updateFall(n) {
  if (state.phase === 'collapse') {
    const t = n - anim.collapse0, th = collapseAngle(n), c = Math.cos(th), s = Math.sin(th);
    const y = P0.y * c - P0.z * s, z = P0.y * s + P0.z * c;
    rig.position.set(P0.x, y, z);
    if (th >= CONFIG.anguloDesprendimientoRad) {
      const w = CONFIG.alfaColapso * t;
      const vy = w * (-P0.y * s - P0.z * c), vz = w * (P0.y * c - P0.z * s);
      anim.fall = { y0: y, z0: z, vy, vz, t0: n };
      const tau = (vy + Math.sqrt(vy * vy + 19.6 * y)) / 9.8;
      state.phase = 'fall';
      logEv('caida');
      vigTarget = 0.85;
      whoosh(tau);
      renderUI();
    }
  } else if (state.phase === 'fall') {
    const f = anim.fall, tau = n - f.t0;
    rig.position.y = f.y0 + f.vy * tau - 4.9 * tau * tau;
    rig.position.z = f.z0 + f.vz * tau;
    if (rig.position.y <= 0) impact();
  }
}
function impact() {
  state.phase = 'impact';
  rig.position.y = 0;
  fade = { a: 1, b: 1, t0: nowS(), d: 0.001, cur: 1 };
  vigTarget = 0; vigMat.opacity = 0;
  stopWhoosh();
  thud();
  logEv('impacto');
  anim.collapsed = true;
  anim.finalAngle = CONFIG.anguloMaxRad;
  renderUI();
  after(CONFIG.negroPostImpactoSeg, () => goDebrief('colapso', true));
}

function computeResult(outcome) {
  const items = DEFECTS.map(d => ({
    nombre: d.nombre, porque: d.porque, estructural: d.estructural,
    found: HIT.some(h => h.defectId === d.id && state.marks.has(h.id))
  }));
  const falsos = HIT.filter(h => !h.defectId && state.marks.has(h.id)).length;
  const struct = items.filter(i => i.estructural), noStruct = items.filter(i => !i.estructural);
  const structFound = struct.filter(i => i.found).length;
  const noStructFound = noStruct.filter(i => !i.estructural && i.found).length;
  const max = struct.length * 2 + noStruct.length;
  let puntaje = Math.round(100 * (structFound * 2 + noStructFound) / max) - CONFIG.penalizacionFalsoPositivo * falsos;
  if (outcome === 'colapso') puntaje = Math.round(puntaje * CONFIG.factorPuntajeSiColapsa);
  puntaje = Math.max(0, Math.min(100, puntaje));
  const todosEstruct = structFound === struct.length;
  let titulo, mensaje, tipo;
  if (outcome === 'detenido' && todosEstruct) {
    tipo = 'detenido_completo';
    titulo = 'Trabajo detenido: andamio no conforme';
    mensaje = 'Identificaste todos los defectos estructurales y detuviste el trabajo antes de subir.';
  } else if (outcome === 'detenido') {
    tipo = 'detenido_parcial';
    titulo = 'Trabajo detenido, pero inspección incompleta';
    mensaje = 'Detuviste el trabajo, pero quedaron defectos estructurales sin identificar. Al corregir solo lo detectado, el andamio seguiría siendo inseguro.';
  } else if (todosEstruct) {
    tipo = 'colapso_consciente';
    titulo = 'Detectaste los defectos, pero autorizaste la subida';
    mensaje = 'Viste los defectos estructurales y aun así subiste. Un defecto detectado no corregido sigue siendo un riesgo: el andamio cedió.';
  } else {
    tipo = 'colapso_inadvertido';
    titulo = 'Subiste con defectos estructurales sin detectar';
    mensaje = 'El andamio cedió. Revisa abajo qué defectos pasaste por alto y por qué importaban.';
  }
  let caida = null;
  if (outcome === 'colapso') {
    const seg = Math.sqrt(2 * TOP / 9.8), kmh = Math.round(Math.sqrt(2 * 9.8 * TOP) * 3.6);
    caida = { altura: TOP, seg: +seg.toFixed(1), kmh,
      texto: 'Caída desde ' + TOP + ' m: unos ' + seg.toFixed(1).replace('.', ',') + ' s en el aire y un impacto a cerca de ' + kmh + ' km/h. Una caída desde esta altura puede causar lesiones graves o la muerte.' };
  }
  return { outcome: tipo, titulo, mensaje, puntaje, items, falsos, caida };
}

function goDebrief(outcome, moved) {
  state.result = computeResult(outcome);
  state.phase = 'debrief';
  logEv('resultado', state.result.outcome + ' | puntaje ' + state.result.puntaje);
  if (moved) {
    rig.position.set(-8, 0, 5);
    rig.rotation.y = faceFrom(-8, 5, 0, 4);
    resetLook(0.18);
  }
  fadeTo(0, 0.8);
  renderUI();
  placePanel();
  postLog();
}

function restart() {
  timers.length = 0;
  state.marks.clear();
  state.phase = 'brief';
  state.result = null;
  state.msg = '';
  state.log = [];
  state.t0 = performance.now();
  anim.collapsed = false;
  anim.fall = null;
  vigTarget = 0; vigMat.opacity = 0;
  stopWhoosh();
  fade = { a: 0, b: 0, t0: nowS(), d: 0.001, cur: 0 };
  teleport(2);
  renderUI();
  placePanel();
}

function sessionPayload() {
  return {
    escenario: 'andamio_mal_arriostrado_v1',
    altura_m: TOP,
    modo_caida: CONFIG.modoCaida,
    fecha: new Date().toISOString(),
    resultado: state.result ? { tipo: state.result.outcome, puntaje: state.result.puntaje, falsos_positivos: state.result.falsos,
      defectos: state.result.items.map(i => ({ nombre: i.nombre, estructural: i.estructural, detectado: i.found })) } : null,
    eventos: state.log
  };
}
function postLog() {
  if (!CONFIG.endpointRegistro) return;
  try { fetch(CONFIG.endpointRegistro, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sessionPayload()) }); } catch (e) {}
}
function downloadLog() {
  const blob = new Blob([JSON.stringify(sessionPayload(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'registro-sesion-andamio.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ============================================================
   INTERFAZ HTML (escritorio)
   ============================================================ */
const elUI = document.getElementById('ui');
const elHud = document.getElementById('hud');
const elHelp = document.getElementById('help');
const elActions = document.getElementById('actions');
const elModal = document.getElementById('modal');
const elCard = document.getElementById('card');
const FASES = { brief: 'Briefing', inspect: 'Inspección previa', climb: 'Subiendo…', work: 'Trabajando en altura', shake: 'Trabajando en altura', lean: '', collapse: '', fall: '', impact: '', debrief: 'Resultado' };

function renderUI() {
  elUI.style.display = state.inXR ? 'none' : 'block';
  elHud.textContent = (FASES[state.phase] || '') + (state.phase === 'inspect' ? '  |  Marcados: ' + state.marks.size : '');
  elHud.style.display = FASES[state.phase] ? 'block' : 'none';
  elHelp.style.display = state.phase === 'inspect' ? 'block' : 'none';

  elActions.innerHTML = '';
  if (state.phase === 'inspect') {
    const b1 = document.createElement('button'); b1.className = 'green'; b1.textContent = 'Reportar andamio NO conforme'; b1.onclick = reportNoConforme;
    const b2 = document.createElement('button'); b2.className = 'red'; b2.textContent = 'Autorizar y subir'; b2.onclick = authorize;
    elActions.append(b1, b2);
  }

  elModal.style.display = 'none';
  if (state.phase === 'brief') {
    elCard.innerHTML = '<h1>Inspección previa de andamio</h1>' +
      '<p>Tarea: reemplazar una luminaria en la fachada, a unos ' + TOP + ' m de altura, trabajando desde este andamio.</p>' +
      '<p>Antes de subir, inspecciónalo. Marca todo lo que consideres un defecto. Luego puedes reportar el andamio como no conforme o autorizar la subida.</p>' +
      '<div class="row"><button id="b-start">Iniciar inspección</button></div>' +
      '<small>Prototipo pedagógico. Contenido por validar con un prevencionista.</small>';
    elModal.style.display = 'flex';
    document.getElementById('b-start').onclick = startInspect;
  } else if (state.phase === 'debrief' && state.result) {
    const r = state.result;
    elCard.innerHTML = '<h1>' + r.titulo + '</h1>' +
      '<p class="score">Puntaje provisorio: ' + r.puntaje + '/100</p><p>' + r.mensaje + '</p>' +
      (r.caida ? '<div class="fall">' + r.caida.texto + '</div>' : '') + '<ul>' +
      r.items.map(it => '<li class="' + (it.found ? 'ok' : 'bad') + '"><b>' + (it.found ? '✔ ' : '✘ ') + it.nombre + '</b><span>' + it.porque + '</span></li>').join('') +
      '</ul>' + (r.falsos ? '<p>Marcaste ' + r.falsos + ' elemento(s) correcto(s) como defecto.</p>' : '') +
      '<div class="row"><button id="b-retry">Reintentar</button><button id="b-json" class="sec">Descargar registro (JSON)</button></div>' +
      '<small>Puntaje provisorio, sin validar con trabajadores reales. Sin referencias normativas aún.</small>';
    elModal.style.display = 'flex';
    document.getElementById('b-retry').onclick = restart;
    document.getElementById('b-json').onclick = downloadLog;
  }
  updatePanelVisibility();
  refreshHits();
}

/* ============================================================
   VR
   ============================================================ */
async function setupVR() {
  const b = document.getElementById('vrbtn');
  if (!navigator.xr) { b.textContent = 'VR no disponible (modo escritorio)'; return; }
  try {
    const ok = await navigator.xr.isSessionSupported('immersive-vr');
    if (!ok) { b.textContent = 'VR no disponible (modo escritorio)'; return; }
    b.textContent = 'Entrar en VR';
    b.disabled = false;
    b.onclick = enterVR;
  } catch (e) { b.textContent = 'VR no disponible (modo escritorio)'; }
}
async function enterVR() {
  try {
    renderer.xr.setReferenceSpaceType('local-floor');
    const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] });
    await renderer.xr.setSession(session);
    state.inXR = true;
    setHandParents(true);
    document.getElementById('vrbtn').style.display = 'none';
    session.addEventListener('end', () => {
      state.inXR = false;
      setHandParents(false);
      document.getElementById('vrbtn').style.display = 'block';
      camera.position.set(0, 1.7, 0);
      applyLook();
      renderUI();
    });
    renderUI();
    placePanel();
  } catch (err) {
    toast('No se pudo iniciar VR: ' + err.message);
  }
}

/* ============================================================
   BUCLE
   ============================================================ */
function animScaffold() {
  const n = nowS();
  if (state.phase === 'shake') {
    const p = Math.min(1, (n - anim.shake0) / CONFIG.remecidoSegundos);
    const a = 0.002 + 0.012 * p;
    scaf.rotation.z = Math.sin(n * 40) * a;
    scaf.rotation.x = Math.sin(n * 33) * a * 0.6;
  } else if (state.phase === 'lean') {
    const p = Math.min(1, (n - anim.lean0) / 0.5);
    scaf.rotation.z = 0;
    scaf.rotation.x = CONFIG.inclinacionRad * p * p;
  } else if (state.phase === 'collapse' || state.phase === 'fall') {
    scaf.rotation.set(collapseAngle(n), 0, 0);
  } else if (anim.collapsed) {
    scaf.rotation.set(anim.finalAngle, 0, 0);
  } else {
    scaf.rotation.set(0, 0, 0);
  }
}

renderer.setAnimationLoop(function () {
  processTimers();
  updateFall(nowS());
  updateFade();
  updateVig();
  animScaffold();
  updateBody();
  trafficUpdate();
  updateAudio();
  updateHover();
  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* arranque */
teleport(2);
renderUI();
setupVR();
window.__sim = { state, CONFIG, DEFECTS, TOP, HIT, rig, body, scene, startInspect, reportNoConforme, authorize, restart };

})();
</script>
